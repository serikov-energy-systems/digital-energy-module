[project]
name = "digienergy"
version = "0.1.0"
description = "Data centres, digital control of demand and digital practices as a module for a European PyPSA model"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "pyarrow>=15", "matplotlib>=3.9", "requests>=2.31", "pypsa>=1.0", "highspy>=1.8", "clarabel>=0.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
